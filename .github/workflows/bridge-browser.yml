name: bridge browser checks

on:
  pull_request:
    branches: [main]
    paths:
      - extensions/claude-bridge/webview/**
      - extensions/claude-bridge/workspace/**
      - .github/workflows/bridge-browser.yml
  push:
    branches: [main]
    paths:
      - extensions/claude-bridge/webview/**
      - extensions/claude-bridge/workspace/**
      - .github/workflows/bridge-browser.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser:
    name: Bridge browser startup and lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            extensions/claude-bridge/webview/package-lock.json
            extensions/claude-bridge/workspace/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: extensions/claude-bridge/webview
      - run: npm run build:browser
        working-directory: extensions/claude-bridge/webview
      - run: npm ci --no-audit --no-fund
        working-directory: extensions/claude-bridge/workspace
      - run: npm run build
        working-directory: extensions/claude-bridge/workspace
      - run: npx playwright install --with-deps chromium --only-shell
        working-directory: extensions/claude-bridge/workspace
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/bridgeweb-playwright
      - run: npm run test:browser
        working-directory: extensions/claude-bridge/workspace
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/bridgeweb-playwright
          BRIDGE_BROWSER_SCREENSHOT: ${{ runner.temp }}/bridge-browser-fixture.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bridge-browser-fixture
          path: ${{ runner.temp }}/bridge-browser-fixture.png
          if-no-files-found: ignore
