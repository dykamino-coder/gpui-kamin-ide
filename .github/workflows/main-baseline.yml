# Baseline availability must never delay the quality workflow or release publication.
name: main baseline artifacts

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    name: Exact Windows main baseline
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - name: Check out the exact main push
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The per-SHA clone builds different profiles in its own target directory.
      # Download only reusable sources; baseline never builds/saves the quality cache.
      - name: Restore Cargo sources (read only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-cargo-inputs-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            windows-cargo-inputs-v1-

      # Use the measured gate dev profile and the repository's html-test alias.
      - name: Build exact main baseline executables
        shell: pwsh
        run: |
          python scripts/ci/build_main_baseline.py --ci-layout --output "$env:RUNNER_TEMP/main-baseline"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = Get-Content -Raw "$env:RUNNER_TEMP/main-baseline/manifest.json" | ConvertFrom-Json
          "### Exact main baseline build cost" >> $env:GITHUB_STEP_SUMMARY
          "- Per-SHA source layout: $($manifest.layout_seconds) seconds; shaders: $($manifest.shader_root)" >> $env:GITHUB_STEP_SUMMARY
          foreach ($build in $manifest.builds) {
            "- $($build.command -join ' '): $($build.seconds) seconds" >> $env:GITHUB_STEP_SUMMARY
          }
          $bytes = ($manifest.files | Measure-Object -Property size -Sum).Sum
          "- Three executables: $([math]::Round($bytes / 1MB, 1)) MiB before compression; retention: 3 days" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload exact main baseline executables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kamin-main-baseline-${{ github.sha }}
          path: |
            ${{ runner.temp }}/main-baseline/main.exe
            ${{ runner.temp }}/main-baseline/html-tests.exe
            ${{ runner.temp }}/main-baseline/html-tests-wpt.exe
            ${{ runner.temp }}/main-baseline/manifest.json
            ${{ runner.temp }}/main-baseline/shaders.hlsl
            ${{ runner.temp }}/main-baseline/color_text_raster.hlsl
            ${{ runner.temp }}/main-baseline/alpha_correction.hlsl
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
          overwrite: true
