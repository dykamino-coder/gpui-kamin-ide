name: pull request checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: scope and whitespace
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      root_node: ${{ steps.changes.outputs.root_node }}
      bridge_server: ${{ steps.changes.outputs.bridge_server }}
      bridge_dashboard: ${{ steps.changes.outputs.bridge_dashboard }}
      bridge_extension: ${{ steps.changes.outputs.bridge_extension }}
      bridge_webview: ${{ steps.changes.outputs.bridge_webview }}
      rust: ${{ steps.changes.outputs.rust }}
      release_pipeline: ${{ steps.changes.outputs.release_pipeline }}
      base_sha: ${{ steps.changes.outputs.base_sha }}
    steps:
      - name: Check out the pull request merge candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect applicable checks
        id: changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$PR_BASE_SHA"
          if [[ -z "$base_sha" && "$EVENT_NAME" == "push" && \
                "$PUSH_BEFORE" =~ ^[0-9a-f]{40}$ && \
                ! "$PUSH_BEFORE" =~ ^0+$ ]]; then
            base_sha="$PUSH_BEFORE"
          fi
          if [[ -z "$base_sha" ]]; then base_sha="$(git rev-parse HEAD^)"; fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

          changed_files="$RUNNER_TEMP/changed-files.txt"
          git diff --check "$base_sha...HEAD"
          git diff --name-only "$base_sha...HEAD" > "$changed_files"

          force_all=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] || \
             grep -Fxq '.github/workflows/pr-checks.yml' "$changed_files"; then
            force_all=true
          fi

          set_scope() {
            local output="$1"
            local pattern="$2"
            if [[ "$force_all" == "true" ]] || grep -Eq "$pattern" "$changed_files"; then
              echo "$output=true" >> "$GITHUB_OUTPUT"
            else
              echo "$output=false" >> "$GITHUB_OUTPUT"
            fi
          }

          set_scope root_node '^(src/|tests/|package(-lock)?\.json$|tsconfig\.json$|eslint\.config\.mjs$|vitest\.config\.[^/]+$|vite\.[^/]*\.config\.[^/]+$|scripts/.*\.(js|mjs|ts)$)'
          set_scope bridge_server '^extensions/claude-bridge/server/'
          set_scope bridge_dashboard '^extensions/claude-bridge/server/src/ui/'
          set_scope bridge_extension '^(extensions/claude-bridge/extension/|builtin-extensions/claude-bridge/(extension\.js|package\.json)$|src/kamin-host/rolling-log\.ts$)'
          set_scope bridge_webview '^(extensions/claude-bridge/webview/|builtin-extensions/claude-bridge/(chat|tools|customize)\.html$)'
          set_scope rust '^(Cargo\.(toml|lock)$|rust-toolchain(\.toml)?$|\.cargo/|crates/|vendor/|scripts/check_event_routing\.py$)'
          set_scope release_pipeline '^(\.github/workflows/docker\.yml$|scripts/release/|extensions/claude-bridge/server/)'

          {
            echo '### Pull request scope'
            echo
            sed 's/^/- `/' "$changed_files" | sed 's/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

  root-node:
    name: root Node checks
    needs: scope
    if: needs.scope.outputs.root_node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the pull request merge candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run check

  bridge-server:
    name: Bridge server checks
    needs: scope
    if: needs.scope.outputs.bridge_server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: extensions/claude-bridge/server
    steps:
      - name: Check out the pull request merge candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/claude-bridge/server/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Check formatting of changed Bridge server files
        env:
          BASE_SHA: ${{ needs.scope.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA...HEAD" \
              | sed -n 's#^extensions/claude-bridge/server/##p' \
              | grep -E '\.(cjs|css|html|js|json|md|mjs|mts|scss|ts|tsx|yaml|yml)$' \
              || true
          )
          if (( ${#files[@]} > 0 )); then
            npx prettier --check "${files[@]}"
          fi

  bridge-extension:
    name: Bridge extension checks
    needs: scope
    if: needs.scope.outputs.bridge_extension == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: extensions/claude-bridge/extension
    steps:
      - name: Check out the pull request merge candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/claude-bridge/extension/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify the committed extension bundle
        working-directory: ${{ github.workspace }}
        run: git diff --exit-code -- builtin-extensions/claude-bridge/extension.js

  bridge-dashboard:
    name: Bridge dashboard build
    needs: scope
    if: needs.scope.outputs.bridge_dashboard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: extensions/claude-bridge/server/src/ui
    steps:
      - name: Check out the pull request merge candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/claude-bridge/server/src/ui/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run build

  bridge-webview:
    name: Bridge webview checks
    needs: scope
    if: needs.scope.outputs.bridge_webview == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: extensions/claude-bridge/webview
    steps:
      - name: Check out the pull request merge candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/claude-bridge/webview/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify the committed webview bundles
        working-directory: ${{ github.workspace }}
        run: git diff --exit-code -- builtin-extensions/claude-bridge/chat.html builtin-extensions/claude-bridge/tools.html builtin-extensions/claude-bridge/customize.html

  rust-windows:
    name: Rust checks on Windows
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out the pull request merge candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust quality components
        run: rustup component add rustfmt clippy

      - name: Restore Cargo inputs and build output
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

      # crates/html tests read the html5lib and WPT parsing corpora from
      # vendor/ (gitignored locally). Pinned to the commits the local runs use.
      - name: Fetch the html5lib and WPT parsing corpora
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 https://github.com/html5lib/html5lib-tests.git vendor/html5lib-tests
          git -C vendor/html5lib-tests fetch -q --depth 1 origin 224991ec10db04f056a89eed8b0bd8695fd2950e
          git -C vendor/html5lib-tests checkout -q 224991ec10db04f056a89eed8b0bd8695fd2950e
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/web-platform-tests/wpt.git vendor/wpt-parsing
          git -C vendor/wpt-parsing sparse-checkout set html/syntax/parsing/resources
          git -C vendor/wpt-parsing fetch -q --depth 1 origin 6371636b3e1c45c8c5f4d83df0026ea591204638
          git -C vendor/wpt-parsing checkout -q 6371636b3e1c45c8c5f4d83df0026ea591204638
          ls vendor/html5lib-tests/tokenizer vendor/html5lib-tests/encoding vendor/wpt-parsing/html/syntax/parsing/resources > /dev/null
          echo "html5lib-tests $(git -C vendor/html5lib-tests rev-parse --short HEAD), wpt $(git -C vendor/wpt-parsing rev-parse --short HEAD)"

      - run: cargo test --workspace
      - run: python scripts/check_event_routing.py

      # PR caches are scoped to refs/pull/*/merge and cannot warm sibling PRs.
      # A trusted main run maintains the default-branch cache all PRs may read.
      - name: Save the shared Cargo cache from main
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}

  release-dry-run:
    name: release pipeline dry run
    needs: scope
    if: needs.scope.outputs.release_pipeline == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the pull request merge candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Exercise installer provenance without production artifacts
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(node --input-type=module -e \
            "import {readReleaseVersions} from './scripts/release/provenance.mjs'; console.log((await readReleaseVersions(process.cwd())).app)")"
          installer="$RUNNER_TEMP/KaminIDE_${app_version}_x64-setup.exe"
          provenance="$RUNNER_TEMP/KaminIDE_${app_version}_provenance.json"
          node -e "require('fs').writeFileSync(process.argv[1], 'non-production CI fixture')" "$installer"
          node scripts/release/provenance-cli.mjs create \
            --installer "$installer" --output "$provenance"
          node scripts/release/provenance-cli.mjs verify \
            --installer "$installer" --provenance "$provenance" \
            --release-sha "$(git rev-parse HEAD)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build the release image without publishing
        env:
          CONTEXT: extensions/claude-bridge/server
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(node --input-type=module -e \
            "import {readReleaseVersions} from './scripts/release/provenance.mjs'; console.log((await readReleaseVersions(process.cwd())).app)")"
          mkdir -p "$CONTEXT/installer"
          node -e "require('fs').writeFileSync(process.argv[1], 'non-production CI fixture')" \
            "$CONTEXT/installer/KaminIDE_${app_version}_x64-setup.exe"
          cache_args=(--cache-from "type=gha,scope=bridge-release")
          if [[ "$GITHUB_REF" == "refs/heads/main" && \
                ("$GITHUB_EVENT_NAME" == "push" || "$GITHUB_EVENT_NAME" == "workflow_dispatch") ]]; then
            cache_args+=(--cache-to "type=gha,mode=max,scope=bridge-release")
          fi

          docker buildx build \
            --platform linux/amd64 \
            --load \
            "${cache_args[@]}" \
            --tag "kaminide-release-dry-run:${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=dry-run" \
            --file "$CONTEXT/Dockerfile" \
            "$CONTEXT"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            "kaminide-release-dry-run:${GITHUB_SHA}")" = "$GITHUB_SHA"

      - name: Smoke-test the built Bridge image
        shell: bash
        run: |
          set -euo pipefail
          image="kaminide-release-dry-run:${GITHUB_SHA}"
          container="$(docker run --detach --publish 127.0.0.1::3456 "$image")"
          cleanup() { docker rm --force "$container" > /dev/null 2>&1 || true; }
          trap cleanup EXIT

          port="$(docker port "$container" 3456/tcp | sed 's/.*://')"
          for _ in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:${port}/health" \
              | jq -e '.status == "ok" and .service == "open-claude-bridge"' \
              > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs "$container" >&2
          exit 1

  quality-gate:
    name: required quality gate
    needs:
      - scope
      - root-node
      - bridge-server
      - bridge-dashboard
      - bridge-extension
      - bridge-webview
      - rust-windows
      - release-dry-run
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable job to pass
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          ROOT_NODE_RESULT: ${{ needs.root-node.result }}
          SERVER_RESULT: ${{ needs.bridge-server.result }}
          DASHBOARD_RESULT: ${{ needs.bridge-dashboard.result }}
          EXTENSION_RESULT: ${{ needs.bridge-extension.result }}
          WEBVIEW_RESULT: ${{ needs.bridge-webview.result }}
          RUST_RESULT: ${{ needs.rust-windows.result }}
          RELEASE_RESULT: ${{ needs.release-dry-run.result }}
        shell: bash
        run: |
          set -euo pipefail
          for result in \
            "$SCOPE_RESULT" \
            "$ROOT_NODE_RESULT" \
            "$SERVER_RESULT" \
            "$DASHBOARD_RESULT" \
            "$EXTENSION_RESULT" \
            "$WEBVIEW_RESULT" \
            "$RUST_RESULT" \
            "$RELEASE_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "Applicable check did not pass: $result" >&2; exit 1 ;;
            esac
          done
