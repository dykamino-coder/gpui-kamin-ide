name: pull request metadata

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

concurrency:
  group: pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  metadata:
    name: PR title and description
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the pull request merge candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Check title and applicable description format
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$RUNNER_TEMP/metadata-files.txt"
          git diff --name-only "$PR_BASE_SHA...HEAD" > "$changed_files"
          release_change="$(node scripts/release/change-cli.mjs \
            --repo "$GITHUB_WORKSPACE" --base "$PR_BASE_SHA" --head HEAD \
            --changed-files "$changed_files")"
          export RELEASE_CANDIDATE="$(jq -r '.release' <<< "$release_change")"
          node --test scripts/ci/pr-metadata.test.mjs
          node scripts/ci/pr-metadata.mjs --event "$GITHUB_EVENT_PATH"
          node scripts/ci/runtime-acceptance.mjs \
            --event "$GITHUB_EVENT_PATH" --files "$changed_files"

          release_candidate="$RELEASE_CANDIDATE"
          if [[ "$release_candidate" == "true" ]]; then
            jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" \
              > "$RUNNER_TEMP/release-pr-body.md"
            node scripts/release/release-notes.mjs \
              --body-file "$RUNNER_TEMP/release-pr-body.md" \
              --repository "$GITHUB_REPOSITORY" \
              --output "$RUNNER_TEMP/release-notes.md" \
              --pulls-output "$RUNNER_TEMP/release-notes-prs.txt"
            previous_tag="$(git tag -l 'kaminide-v[0-9]*' \
              --sort=-version:refname | sed -n '1p')"
            notes_args=()
            if [[ -n "$previous_tag" ]]; then
              notes_args+=(--previous-tag "$previous_tag")
            fi
            node scripts/release/verify-release-notes-prs.mjs \
              --pulls-file "$RUNNER_TEMP/release-notes-prs.txt" \
              --repository "$GITHUB_REPOSITORY" --head HEAD \
              "${notes_args[@]}"
          fi
