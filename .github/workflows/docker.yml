# Сборка и публикация dykamino/open-claude-bridge из extensions/claude-bridge/server/.
# Версия = server/package.json; существующий тег на Docker Hub не перезаписывается
# (workflow_dispatch с force=true — единственный способ перезаписать).
# Инсталлер KaminIDE (161MB) живёт GitHub Release'ом `kaminide-latest`, не в git —
# он собирается и подписывается локально, workflow лишь скачивает его в installer/.
# TODO перед мержем: запинить все uses: на полные commit SHA (Dependabot настроен).
name: docker

on:
  push:
    branches: [main]
    paths:
      - 'extensions/claude-bridge/server/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Push even if the version tag already exists on Docker Hub'
        type: boolean
        default: false

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: dykamino/open-claude-bridge
  CONTEXT: extensions/claude-bridge/server

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read server version
        id: ver
        run: echo "version=$(node -p "require('./$CONTEXT/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Skip if tag already on Docker Hub
        id: guard
        run: |
          if [ "${{ inputs.force }}" != "true" ] && \
             docker manifest inspect "$IMAGE:${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$IMAGE:${{ steps.ver.outputs.version }} already published — skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Dockerfile бакает installer/KaminIDE_*_x64-setup.exe по глобу — без файла
      # COPY падает. Release kaminide-latest обновляется локальным релиз-циклом.
      - name: Fetch KaminIDE installer from release
        if: steps.guard.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$CONTEXT/installer"
          gh release download kaminide-latest \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'KaminIDE_*_x64-setup.exe' \
            --dir "$CONTEXT/installer"
          ls -la "$CONTEXT/installer"

      - uses: docker/setup-buildx-action@v4
        if: steps.guard.outputs.exists == 'false'

      - uses: docker/login-action@v4
        if: steps.guard.outputs.exists == 'false'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        if: steps.guard.outputs.exists == 'false'
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        if: steps.guard.outputs.exists == 'false'
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.CONTEXT }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
          # CLAUDE_CODE_CACHE_BUST намеренно не передаём: версия CLI запинена
          # ARG'ом в Dockerfile, bust только ломает кэш слоя.
