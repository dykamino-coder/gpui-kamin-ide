[package]
name = "kaminide-setup"
version.workspace = true
edition.workspace = true

[[bin]]
name = "kaminide-setup"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
# Распаковка приклеенного payload (tar.zst каталога dist-installer).
zstd = "0.13"
tar = "0.4"
# Брендированное окно с полосой прогресса (обычный запуск и /update).
gpui.workspace = true

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_UI_WindowsAndMessaging",
] }
