[package]
name = "kaminide-setup"
version.workspace = true
edition.workspace = true

[[bin]]
name = "kaminide-setup"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
# Распаковка приклеенного payload (tar.zst каталога dist-installer).
zstd = "0.13"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_UI_WindowsAndMessaging",
] }

# GUI-окно (бренд) придёт следующей фазой: gpui сюда НЕ тянем, пока ядро
# (silent /S и /update) не пройдёт e2e — бинарь ~2MB против ~15MB.
