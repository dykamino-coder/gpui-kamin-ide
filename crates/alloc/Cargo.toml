[package]
name = "kamin-alloc"
version.workspace = true
edition.workspace = true

# Политика арен mimalloc, общая для бинарей с `#[global_allocator] MiMalloc`:
# приложение (`kaminide-gpui` и его дети CEF) и стенд движка `engine_bench`.

[features]
profiler = ["dep:kamin-profiler"]

[dependencies]
kamin-profiler = { path = "../profiler", optional = true, features = ["allocations"] }
mimalloc.workspace = true

[lints]
workspace = true
