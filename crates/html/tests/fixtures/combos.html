<!-- Максимум комбинаций: скругления, рамки, вложенность, таблицы с кнопками,
     сетки, переносы, позиционирование. Цвета уникальны — по ним сверяется
     геометрия каждого блока против Chrome. -->
<style>
  html, body { margin: 0; padding: 0; background: #ffffff }
  .page { width: 860px; padding: 16px; box-sizing: border-box }
  .r { display: flex; gap: 8px; margin: 0 0 10px; align-items: flex-start }
  .sq { width: 56px; height: 36px }

  /* Скругления во всех сочетаниях */
  .r1 { border-radius: 4px; background: #1c7ed6 }
  .r2 { border-radius: 18px; background: #2f9e44 }
  .r3 { border-radius: 18px 4px 18px 4px; background: #e8590c }
  .r4 { border-radius: 0 0 18px 18px; background: #ae3ec9 }
  .r5 { border-radius: 4px; border: 3px solid #212529; background: #fcc419 }
  .r6 { border-radius: 14px; border: 6px solid #c92a2a; background: #ffffff }

  /* Рамки по сторонам */
  .b1 { border-left: 6px solid #0c8599; background: #e3fafc; width: 120px; height: 40px }
  .b2 { border-top: 6px solid #5f3dc4; background: #f3f0ff; width: 120px; height: 40px }
  .b3 { border: 2px solid #343a40; background: #f8f9fa; width: 120px; height: 40px;
        box-sizing: border-box }

  /* Вложенность с отступами */
  .outer { background: #dee2e6; padding: 10px; width: 260px }
  .mid { background: #adb5bd; padding: 8px }
  .inner { background: #495057; height: 24px }

  /* Таблица с кнопками и компонентами */
  table { margin: 0 0 12px }
  th, td { padding: 6px 10px }
  .btn { background: #364fc7; border-radius: 4px; width: 74px; height: 24px }
  .btn2 { background: #a61e4d; border-radius: 12px; width: 60px; height: 24px }
  .bar { background: #d0ebff; height: 10px; width: 90px; border-radius: 5px }
  .cellbox { background: #ffec99; height: 18px; width: 40px }

  /* Сетки */
  .g1 { display: grid; grid-template-columns: 120px 1fr 80px; gap: 6px;
        width: 520px; margin: 0 0 10px }
  .g2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
        width: 400px; margin: 0 0 10px }
  .gc { height: 28px }

  /* Переносы и выравнивания */
  .wrapbox { display: flex; flex-wrap: wrap; gap: 5px; width: 260px; margin: 0 0 10px }
  .w { width: 78px; height: 22px; background: #40c057 }
  .between { display: flex; justify-content: space-between; align-items: center;
             width: 420px; height: 44px; background: #f1f3f5; margin: 0 0 10px }
  .around { display: flex; justify-content: space-around; width: 420px;
            height: 30px; background: #e9ecef; margin: 0 0 10px }
  .colrev { display: flex; flex-direction: column-reverse; gap: 4px;
            height: 90px; width: 90px; background: #ffe8cc; margin: 0 0 10px }

  /* Позиционирование и наложение */
  .stagebox { position: relative; height: 90px; background: #f8f9fa; margin: 0 0 10px }
  .p1 { position: absolute; top: 6px; left: 8px; width: 70px; height: 24px; background: #f76707 }
  .p2 { position: absolute; top: 6px; right: 8px; width: 70px; height: 24px; background: #0ca678 }
  .p3 { position: absolute; bottom: 6px; left: 8px; right: 8px; height: 20px; background: #7048e8 }
  .p4 { position: absolute; top: 34px; left: 40%; width: 90px; height: 26px;
        background: #d6336c; border-radius: 13px }
</style>

<div class="page">
  <!-- Скругления -->
  <div class="r">
    <div class="sq r1"></div><div class="sq r2"></div><div class="sq r3"></div>
    <div class="sq r4"></div><div class="sq r5"></div><div class="sq r6"></div>
  </div>

  <!-- Рамки по сторонам и box-sizing -->
  <div class="r">
    <div class="b1"></div><div class="b2"></div><div class="b3"></div>
  </div>

  <!-- Вложенность -->
  <div class="outer" style="margin: 0 0 10px">
    <div class="mid"><div class="inner"></div></div>
  </div>

  <!-- Таблица: кнопки, полосы, чипы в ячейках -->
  <table>
    <tr>
      <th><div class="cellbox"></div></th>
      <th><div class="bar"></div></th>
      <th><div class="btn"></div></th>
    </tr>
    <tr>
      <td><div class="cellbox" style="background: #ffd43b"></div></td>
      <td><div class="bar" style="background: #a5d8ff"></div></td>
      <td>
        <div style="display: flex; gap: 6px">
          <div class="btn" style="background: #1971c2"></div>
          <div class="btn2"></div>
        </div>
      </td>
    </tr>
  </table>

  <!-- Сетки -->
  <div class="g1">
    <div class="gc" style="background: #e03131"></div>
    <div class="gc" style="background: #2b8a3e"></div>
    <div class="gc" style="background: #1864ab"></div>
  </div>
  <div class="g2">
    <div class="gc" style="background: #c2255c"></div>
    <div class="gc" style="background: #087f5b"></div>
    <div class="gc" style="background: #e67700"></div>
  </div>

  <!-- Перенос -->
  <div class="wrapbox">
    <div class="w"></div><div class="w" style="background: #37b24d"></div>
    <div class="w" style="background: #2f9e44"></div>
  </div>

  <!-- Распределение и обратная колонка -->
  <div class="between">
    <div style="width: 70px; height: 26px; background: #5c940d"></div>
    <div style="width: 70px; height: 26px; background: #862e9c"></div>
  </div>
  <div class="around">
    <div style="width: 50px; height: 20px; background: #0b7285"></div>
    <div style="width: 50px; height: 20px; background: #6741d9"></div>
  </div>
  <div class="colrev">
    <div style="height: 26px; background: #f59f00"></div>
    <div style="height: 26px; background: #d9480f"></div>
  </div>

  <!-- Наложение -->
  <div class="stagebox">
    <div class="p1"></div><div class="p2"></div><div class="p3"></div><div class="p4"></div>
  </div>
</div>
