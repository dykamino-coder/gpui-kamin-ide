<!-- Размытие поддерева: `filter: blur(N)` собирает картинку детей целиком и
     размывает её. Первая карточка без размытия — эталон резкости, дальше тот
     же блок с разными радиусами: слабым, средним и широким. -->
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font: 14px system-ui }
  .page { width: 620px; padding: 20px; box-sizing: border-box }
  .row { display: flex; gap: 36px; margin: 0 0 40px }
  .card { width: 160px; height: 100px; background: #1c7ed6; border-radius: 12px;
          color: #fff; padding: 12px; box-sizing: border-box }
  .card .tag { width: 70px; height: 22px; background: #ffd8a8; border-radius: 6px }
  .card .bar { width: 110px; height: 12px; background: #e8590c; margin-top: 10px }
  .b2 { filter: blur(2px) }
  .b6 { filter: blur(6px) }
  .b16 { filter: blur(16px) }
</style>

<div class="page">
  <div class="row">
    <div class="card">
      <div class="tag"></div>
      <div class="bar"></div>
    </div>
    <div class="card b2">
      <div class="tag"></div>
      <div class="bar"></div>
    </div>
  </div>
  <div class="row">
    <div class="card b6">
      <div class="tag"></div>
      <div class="bar"></div>
    </div>
    <div class="card b16">
      <div class="tag"></div>
      <div class="bar"></div>
    </div>
  </div>
</div>
