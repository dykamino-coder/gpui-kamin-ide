<!-- Семантика флекса и грида по пунктам. Цвета уникальны — по ним сверяются
     габариты каждого блока против Chrome. -->
<style>
  html, body { margin: 0; padding: 0; background: #ffffff }
  .page { width: 860px; padding: 16px; box-sizing: border-box }
  .row { margin: 0 0 14px }

  /* 1. flex-basis в процентах и в содержимом */
  .f1 { display: flex; width: 400px; height: 40px }
  .f1 .a { flex: 0 0 25%; background: #1c7ed6 }
  .f1 .b { flex: 0 0 50%; background: #2f9e44 }
  .f1 .c { flex: 1; background: #e8590c }

  /* 2. flex-shrink с весами: 300+300 в 400 → ужимаются по весу 1:3 */
  .f2 { display: flex; width: 400px; height: 30px }
  .f2 .a { width: 300px; flex-shrink: 1; background: #862e9c }
  .f2 .b { width: 300px; flex-shrink: 3; background: #0b7285 }

  /* 3. align-self против растяжения */
  .f3 { display: flex; width: 400px; height: 60px; align-items: stretch;
        background: #f1f3f5 }
  .f3 .a { width: 80px; background: #a61e4d }
  .f3 .b { width: 80px; align-self: center; height: 20px; background: #5f3dc4 }
  .f3 .c { width: 80px; align-self: flex-end; height: 20px; background: #087f5b }

  /* 4. Обратный перенос */
  .f4 { display: flex; flex-wrap: wrap-reverse; width: 200px; height: 80px;
        background: #e9ecef; align-content: flex-start }
  .f4 div { width: 90px; height: 30px; background: #f76707 }

  /* 5. Вложенные гибкие контейнеры и доли */
  .f5 { display: flex; width: 400px; height: 40px; gap: 10px }
  .f5 .outer { flex: 1; display: flex; gap: 6px; background: #dee2e6 }
  .f5 .inner { flex: 1; background: #364fc7 }

  /* 6. Сетка: auto-fill по минимальной ширине */
  .g1 { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 8px; width: 500px }
  .g1 div { height: 26px; background: #c2255c }

  /* 7. Проценты в дорожках */
  .g2 { display: grid; grid-template-columns: 25% 50% 25%; width: 480px;
        gap: 0 }
  .g2 div { height: 26px }

  /* 8. Отрицательный номер линии и span вместе с номером */
  .g3 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
        width: 480px }
  .g3 .wide { grid-column: 1 / -1; height: 20px; background: #d6336c }
  .g3 .part { grid-column: 2 / span 2; height: 20px; background: #37b24d }

  /* 9. Выравнивание одной ячейки */
  .g4 { display: grid; grid-template-columns: repeat(3, 1fr);
        grid-template-rows: 50px; gap: 6px; width: 400px }
  .g4 .s1 { justify-self: start; align-self: start; width: 40px; height: 20px;
            background: #1098ad }
  .g4 .s2 { justify-self: center; align-self: center; width: 40px; height: 20px;
            background: #f59f00 }
  .g4 .s3 { justify-self: end; align-self: end; width: 40px; height: 20px;
            background: #7048e8 }

  /* 10. Детей больше, чем ячеек: неявные строки */
  .g5 { display: grid; grid-template-columns: repeat(3, 1fr);
        grid-auto-rows: 18px; gap: 5px; width: 300px }
  .g5 div { background: #099268 }
</style>

<div class="page">
  <div class="row f1"><div class="a"></div><div class="b"></div><div class="c"></div></div>
  <div class="row f2"><div class="a"></div><div class="b"></div></div>
  <div class="row f3"><div class="a"></div><div class="b"></div><div class="c"></div></div>
  <div class="row f4"><div></div><div style="background: #d9480f"></div></div>
  <div class="row f5">
    <div class="outer"><div class="inner"></div><div class="inner" style="background: #1864ab"></div></div>
    <div class="outer" style="background: #ced4da"><div class="inner" style="background: #5c940d"></div></div>
  </div>

  <div class="row g1">
    <div></div><div style="background: #a61e4d"></div><div style="background: #e64980"></div>
  </div>

  <div class="row g2">
    <div style="background: #212529"></div>
    <div style="background: #495057"></div>
    <div style="background: #868e96"></div>
  </div>

  <div class="row g3">
    <div class="wide"></div>
    <div class="part"></div>
  </div>

  <div class="row g4">
    <div class="s1"></div><div class="s2"></div><div class="s3"></div>
  </div>

  <div class="row g5">
    <div style="background: #0c8599"></div>
    <div style="background: #1971c2"></div>
    <div style="background: #6741d9"></div>
    <div style="background: #ae3ec9"></div>
  </div>
</div>
