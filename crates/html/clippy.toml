# The library reads no environment: behaviour must not depend on debug flags.
# The WPT runner example (examples/wptrun*) keeps its WPT_* run settings and
# allows this lint at its crate root.
disallowed-methods = [
    { path = "std::env::var", reason = "no environment reads in kamin-html (debug flags were removed)" },
    { path = "std::env::var_os", reason = "no environment reads in kamin-html (debug flags were removed)" },
    { path = "std::env::vars", reason = "no environment reads in kamin-html (debug flags were removed)" },
]

# `NodeKey` hashes and compares a DOM node by identity (pointer), never by its
# mutable content: its interior mutability cannot change a key.
ignore-interior-mutability = ["kamin_html::dom::tree_index::NodeKey"]
