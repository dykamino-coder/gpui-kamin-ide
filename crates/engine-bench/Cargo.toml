[package]
name = "engine-bench"
version.workspace = true
edition.workspace = true
publish = false

[features]
engine-bench = ["dep:kamin-html"]

[[bin]]
name = "engine_bench"
path = "src/main.rs"
required-features = ["engine-bench"]

[dependencies]
kamin-html = { workspace = true, optional = true, features = ["engine-bench"] }
gpui.workspace = true
gpui-platform.workspace = true
mimalloc.workspace = true
futures = "0.3"
encoding_rs = "0.8.35"
html5ever = { path = "../../vendor/html5ever" }
markup5ever_rcdom = { path = "../../vendor/markup5ever_rcdom" }
url = "2"
serde_json.workspace = true
png = "0.18.1"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
