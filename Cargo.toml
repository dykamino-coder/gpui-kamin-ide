[workspace]
resolver = "2"
members = ["crates/*"]
# Keep upstream formatting in path dependencies outside workspace-wide rustfmt.
exclude = [
  "vendor/gpui",
  "vendor/gpui-windows",
  "vendor/gpui-base",
  "vendor/gpui-component",
  "vendor/taffy",
  "vendor/html5ever",
  "vendor/tendril",
  "vendor/xml-rs",
  "vendor/markup5ever_rcdom",
  "vendor/resvg",
  "vendor/usvg",
]

[workspace.package]
version = "1.0.80"
edition = "2024"

# Keep fallible results visible at every workspace boundary.
[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
redundant_clone = "deny"
declare_interior_mutable_const = "deny"
disallowed_methods = "deny"
print_stdout = "deny"
print_stderr = "deny"
# As in GPUI, preserve the established DSL spelling; correctness lints
# and explicit denies above still apply independently of style suggestions.
style = { level = "allow", priority = -1 }

[workspace.dependencies]
# Пакет на crates.io — `gpui-pre` (снимок zed@279fe07), библиотека — `gpui`.
# Обход построителя хранит продолжения на куче; GPUI проверяется на обычном стеке.
gpui = { package = "gpui-pre", version = "=0.3.8" }
# Платформа (Windows-бэкенд) вынесена из ядра: `gpui_platform::application()`.
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.8" }
# Грамматики ровно тех языков, что выдаёт `file_names::editor_lang`. В 0.5.1
# без фич была только JSON, и ею же (случайно) раскрашивался код остальных
# языков; 0.7.1 для неизвестной грамматики не красит вовсе.
gpui-component = { version = "=0.7.1", features = [
  "tree-sitter",
  "tree-sitter-rust",
  "tree-sitter-typescript",
  "tree-sitter-javascript",
  "tree-sitter-markdown",
  "tree-sitter-go",
  "tree-sitter-html",
  "tree-sitter-zig",
] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mimalloc = "0.1"
kamin-metrics = { path = "crates/metrics" }
kamin-theme = { path = "crates/theme" }
kamin-probe = { path = "crates/probe" }
kamin-ws = { path = "crates/ws" }
kamin-model = { path = "crates/model" }
kamin-sidecar = { path = "crates/sidecar" }
kamin-crash = { path = "crates/crash" }
kamin-html = { path = "crates/html" }

# Perf-профиль из plan/10 (DLP-иммунитет: mimalloc в shell; размер/скорость)
[profile.release]
lto = "fat"
# СКОРОСТЬ, а не размер. С "s" раскладка taffy стоила 20 мс на кадр (968 узлов,
# 4700 замеров) — 28 кадров в секунду на пустом интерфейсе; "s" душит именно
# такой счётный код. Размер exe вырос, кадр подешевел (замер в Ф6 плана 101).
opt-level = 3
panic = "abort"
codegen-units = 1
strip = true

# gpui в dev-профиле без оптимизаций неюзабелен — оптимизируем зависимости
[profile.dev.package."*"]
opt-level = 2

# И НАШ код тоже. Дженерики gpui (div(), Styled, элементы) разворачиваются
# ИМЕННО в нашем крейте, поэтому при opt-level 0 неоптимизированной остаётся
# основная часть layout+paint: замер показал кадр окна 150 мс на сцене из 74
# квадратов. Отладочная информация остаётся — под отладчиком код читается.
[profile.dev]
opt-level = 2

# Инкрементальная сборка движка: одна CGU на модуль, без слияния. Слияние до
# 256 жадное по размеру: правка тела одной функции перестраивает группы, и
# заново кодогенерируется большая часть крейта. Предел держать выше числа
# модулей движка с кодом (иначе слияние вернётся).
[profile.dev.package.kamin-html]
codegen-units = 4096

# Быстрые проверки агентов: артефакты отдельно в target/agent.
# Отладочная информация не нужна при автоматических проверках.
[profile.agent]
inherits = "dev"
opt-level = 0
debug = 0
incremental = true
codegen-units = 256

# Пакетная настройка dev наследуется; профиль агента остаётся прежним.
[profile.agent.package.kamin-html]
codegen-units = 256

# Wildcard Cargo относится только к зависимостям вне workspace.
# GPUI и декодеры сохраняют оптимизацию; их код меняется редко.
[profile.agent.package."*"]
opt-level = 2
debug = "line-tables-only"
codegen-units = 16

[patch.crates-io]
# Существующий узел зависимостей: fallible storage сохраняет leases до drop.
tendril = { path = "vendor/tendril" }
xml-rs = { path = "vendor/xml-rs" }
# Vendored gpui (gpui-pre 0.3.8 + патчи KaminIDE: рендер CSS, текст, раскладка,
# захват кадра). Windows-платформа в 0.3.8 — отдельный крейт, тоже с патчами
# (DirectX-рендерер, DirectWrite, dcomp/blit по окну).
gpui-pre = { path = "vendor/gpui" }
gpui-pre-windows = { path = "vendor/gpui-windows" }
# Vendored gpui-component 0.7.1 и gpui-base 0.7.1 (движок ввода/Root переехали
# туда): патчи редактора (миникарта, скроллбар, кэш подсветки).
gpui-component = { path = "vendor/gpui-component" }
gpui-base = { path = "vendor/gpui-base" }
# Вендорён ради базовой линии текста: замер ЛИСТА теперь может её отдать
# (`MeasureOutput`), иначе `align-items: baseline` выравнивает по нижним краям.
taffy = { path = "vendor/taffy" }
# Vendored resvg + usvg: upstream linebender/resvg main 77b12f49 (0.48.1 +
# fixes) with KaminIDE patches (feDisplacementMap, feConvolveMatrix bias,
# feColorMatrix rounding, 1:1 pattern sampling) — see vendor/resvg-kaminide.patch.
# usvg moves with resvg: upstream resvg main needs the new usvg enum variants.
resvg = { path = "vendor/resvg" }
usvg = { path = "vendor/usvg" }
