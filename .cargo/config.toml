[target.x86_64-pc-windows-msvc]
# 8 МиБ: поддерживаемая глубина reflow 1026 и построения боксов 2052.
# Обходы DOM и сборка боксов используют heap, большие временные значения
# фаз GPUI не удерживаются при обходе детей. Проверено depth_tests на 8 МиБ.
rustflags = ["-C", "link-args=/STACK:8388608"]

[env]
# Потоки libtest используют тот же предел стека, что и приложение.
RUST_MIN_STACK = "8388608"

[alias]
# Изолированный профиль агента; dev/release и installer не меняются.
html-build = ["build", "-p", "kamin-html", "--lib", "--profile", "agent", "--config", "target.x86_64-pc-windows-msvc.linker=\"rust-lld\""]
html-test = ["test", "-p", "kamin-html", "--lib", "--profile", "agent", "--config", "target.x86_64-pc-windows-msvc.linker=\"rust-lld\""]
